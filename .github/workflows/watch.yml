name: watch

on:
  schedule:
    # Every 15 minutes. GitHub cron is best-effort; runs may be delayed.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Never let two runs race on the same seen.json commit.
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        run: |
          set +e
          python watcher.py
          code=$?
          if [[ $code -eq 1 ]]; then
            # Source looked blocked (non-200 / zero items). State was left
            # untouched. Tolerate it so GitHub doesn't email a failed-run alert.
            echo "::warning::watcher exited 1 (source likely blocked); state untouched"
            exit 0
          fi
          exit $code

      - name: Commit state if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "craigslist-watcher-bot"
            git config user.email "craigslist-watcher-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen listings [skip ci]"
            git push
          else
            echo "seen.json unchanged; nothing to commit"
          fi
